<style>

  .chip { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.03); font: 500 19px 'JetBrains Mono', monospace; color: #d7e3dc; }

  h1 span { background: linear-gradient(100deg, #4ade80, #2dd4bf 50%, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
  h1 i { font-style: normal; color: #4ade80; }
  .role { margin-top: 30px; font: 600 38px 'Bricolage Grotesque'; color: #f1f5f4; letter-spacing: -.01em; }
