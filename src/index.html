<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Title, description, Open Graph et canonical : générés depuis src/app/core/portfolio.data.ts (SITE) au pré-rendu. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06080a">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    (function (root) {
      try { var t = localStorage.getItem('theme'); if (t) root.setAttribute('data-theme', t); } catch (e) {}
      // .js active l'effet d'apparition ; sans JavaScript, tout le contenu reste visible.
      root.classList.add('js');
      // Secours : si l'application ne démarre pas, on réaffiche le contenu masqué.
      setTimeout(function () { if (!root.classList.contains('app-ready')) root.classList.remove('js'); }, 6000);
    })(document.documentElement);
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
