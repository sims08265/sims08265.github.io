<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <!-- Title, description, Open Graph et canonical : générés depuis src/app/core/portfolio.data.ts (SITE) au pré-rendu. -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06080a">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preload" href="fonts/bricolage-grotesque-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    (function (root) {
      try { var t = localStorage.getItem('theme'); if (t) root.setAttribute('data-theme', t); } catch (e) {}
      // .js active l'effet d'apparition ; sans JavaScript, tout le contenu reste visible.
      root.classList.add('js');
      // Secours : si l'application ne démarre pas, on réaffiche le contenu masqué.
      setTimeout(function () { if (!root.classList.contains('app-ready')) root.classList.remove('js'); }, 6000);
    })(document.documentElement);
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
